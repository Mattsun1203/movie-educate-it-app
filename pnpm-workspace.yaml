packages:
  - "front"
  - "back"

allowBuilds:
  '@prisma/engines': true
  cpu-features: true
  esbuild: true
  msw: true
  prisma: true
  protobufjs: true
  sharp: true
  ssh2: true
  unrs-resolver: true
  workerd: true

minimumReleaseAgeExclude:
  - '@storybook/addon-a11y@10.5.3'
  - '@storybook/addon-docs@10.5.3'
  - '@storybook/addon-vitest@10.5.3'
  - '@storybook/builder-vite@10.5.3'
  - '@storybook/csf-plugin@10.5.3'
  - '@storybook/nextjs-vite@10.5.3'
  - '@storybook/react-dom-shim@10.5.3'
  - '@storybook/react-vite@10.5.3'
  - '@storybook/react@10.5.3'
  - storybook@10.5.3
  - '@cloudflare/vitest-pool-workers@0.20.1'
  - '@cloudflare/workers-types@5.20260801.1'
  - miniflare@5.20260730.0-alpha
  - wrangler@4.118.0
